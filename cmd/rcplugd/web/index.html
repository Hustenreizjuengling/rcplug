<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rcplug · RØDECaster</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%2319c37d%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%223%22 fill=%22%230d1015%22/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d1015; --panel:#151a21; --panel2:#1c232c; --line:#2a333f;
    --fg:#e7edf3; --muted:#9aa8b6; --accent:#19c37d; --blue:#2f81f7;
    --danger:#f85149; --warn:#e3a008;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:650;white-space:nowrap}
  header .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  header .dot.off{background:var(--danger);box-shadow:none}
  .vitals{display:flex;gap:14px;color:var(--muted);font-size:12px;margin-left:auto;flex-wrap:wrap}
  .vitals b{color:var(--fg);font-weight:600}
  nav{display:flex;gap:2px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav a{padding:9px 12px;color:var(--muted);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
  nav a:hover{color:var(--fg)}
  nav a.on{color:var(--fg);border-bottom-color:var(--accent)}
  nav a .st{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  nav a .st.running{background:var(--accent)}
  nav a .st.backoff{background:var(--warn)}
  body.offline nav a .st, body.offline .tag.running, body.offline .tag.starting, body.offline .tag.backoff{background:var(--muted);color:var(--muted);border-color:var(--line);opacity:.5}
  nav .sep{flex:1}
  #view{flex:1;min-height:0;display:flex;flex-direction:column}
  iframe{flex:1;border:0;width:100%;background:var(--bg)}
  .page{max-width:960px;margin:0 auto;padding:20px;width:100%;overflow:auto}
  .grid{display:grid;gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .card h2{margin:0 0 2px;font-size:16px}
  .card .desc{color:var(--muted);font-size:13px;margin:0 0 12px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tag{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
  .tag.running{color:var(--accent);border-color:var(--accent)}
  .tag.starting{color:var(--blue);border-color:var(--blue)}
  .tag.backoff{color:var(--warn);border-color:var(--warn)}
  .spacer{flex:1}
  button,.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:7px 14px;text-decoration:none}
  button:hover,.btn:hover{border-color:var(--blue)}
  button:disabled{opacity:.5;cursor:default}
  button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:#04261a;font-weight:600}
  button.danger{color:var(--danger);border-color:var(--danger);background:transparent}
  button.small{padding:3px 10px;font-size:12px}
  .logs{margin-top:12px;background:#0a0d12;border:1px solid var(--line);border-radius:8px;padding:10px;
    font:12px ui-monospace,Menlo,Consolas,monospace;color:#c9d4df;max-height:240px;overflow:auto;white-space:pre-wrap}
  .muted{color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:50px 20px}
  .linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;padding:0;font-size:12px}
  .banner{background:#2a2110;border:1px solid var(--warn);color:#ffe2a3;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
  .error{color:#ffb3ae;font-size:12px}
  dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0}
  dl.kv dt{color:var(--muted)} dl.kv dd{margin:0}
  .bar{height:6px;background:#0a0d12;border-radius:3px;overflow:hidden;border:1px solid var(--line);margin-top:4px}
  .bar i{display:block;height:100%;background:var(--accent)}
  .note{color:var(--muted);font-size:12px;margin-top:16px}
  .tag.update{color:var(--blue);border-color:var(--blue)}
  .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--blue);color:#fff;font-size:11px;font-weight:600;text-align:center;line-height:18px}
  .upd{border-top:1px solid var(--line);padding:10px 0}
  .upd:first-child{border-top:0}
  .upd .ver{font-variant-numeric:tabular-nums}
  details summary{cursor:pointer;color:var(--muted);font-size:12px}
  details .logs{margin-top:6px}
  .ok{color:var(--accent)}
  .opts{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:12px}
  .opts label{display:grid;gap:3px;font-size:13px}
  .opts .odesc{color:var(--muted);font-size:12px}
  .opts select,.opts input[type=text],.opts input[type=number]{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:320px}
  .opts .check{display:flex;gap:8px;align-items:center}
  .opts .linkbtn{justify-self:start}
  .opts[hidden]{display:none}
  @media (max-width:700px){ .vitals{margin-left:0;width:100%} }
</style>
</head>
<body>

  <span class="dot" id="dot" aria-hidden="true"></span>
  <h1 id="title">rcplug</h1>
  <div class="vitals" id="vitals" aria-live="polite"></div>

</header>
<nav id="nav" aria-label="Plugins"></nav>
<div id="view"><div class="empty" id="boot"></div></div>
<script>
'use strict';
const T = {
  en: {

    updPhaseDownload: 'Downloading (slowly on purpose, so the USB audio is not disturbed)', updPhaseUnpack: 'Unpacking', updAmount: '{done} of {total} MB · {pct} %', updEta: 'about {s} s left',
    updRunning: 'Installing {name} {v}…', updRestarting: 'rcplug {v} is being installed and restarts now. This page reloads by itself when it is back.',

    days: '{d} d {h} h', hours: '{h} h {m} min', mins: '{m} min', switchLang: 'Deutsch',
    settings: 'Settings', optSave: 'Save', optSaveRestart: 'Save and restart', optSaved: 'Saved.', optSavedRestart: 'Saved; the plugin restarts.',
    optDefault: 'default: {v}', optReset: 'use the default', optYes: 'on', optNo: 'off', optHint: 'Changes take effect when the plugin starts.',
  },
  de: {
    connecting: 'verbinde…', offline: 'Host nicht erreichbar', cpu: 'CPU', load: 'Last', ramFree: 'RAM frei', up: 'an seit',
    plugins: 'Plugins', system: 'System', rescan: 'Neu einlesen', rescanHint: 'Plugin-Ordner neu einlesen', skipped: 'Übersprungene Plugin-Ordner:',

    stop: 'Stoppen', restart: 'Neu starten', start: 'Starten', log: 'Log', restarts: 'Neustarts: {n}', startpage: 'Startseite', audio: 'Audio',
    unknown: 'unbekannte plugin.json-Felder: {f}', notFound: 'Plugin nicht gefunden.', isState: 'Das Plugin ist gerade {state}', autoRestart: 'Es wird automatisch neu gestartet…',
    failed: 'Aktion fehlgeschlagen: {err}', emptyLog: '(leer)', noLog: '(kein Log)', footer: 'rcplug – Funktionen für den RØDECaster ohne neue Firmware.',
    st_running: 'läuft', st_starting: 'startet', st_backoff: 'Neustart…', st_stopped: 'gestoppt',
    sysTitle: 'System', sysDesc: 'Zustand des Geräts und des Plugin-Hosts.', hostname: 'Hostname', arch: 'Architektur', temp: 'CPU-Temperatur',
    loadAvg: 'Last (1/5/15 min)', memory: 'Arbeitsspeicher', disk: 'Speicher (rcplug)', devUp: 'Gerät läuft seit', hostUp: 'rcplug läuft seit',
    version: 'rcplug-Version', clock: 'Uhrzeit (Gerät)', memUsed: '{used} / {total} MB belegt', diskFree: '{free} MB frei von {total} MB',
    disclaimer: 'rcplug ist inoffizielle Software und steht in keiner Verbindung zu RØDE Microphones. RØDE und RØDECaster sind Marken ihres Inhabers. Nutzung auf eigene Gefahr.',
    diagTitle: 'Diagnose', diagText: 'Wenn etwas nicht funktioniert: dieses Paket herunterladen (Logs, Versionen, Gerätezustand; Passwörter und Schlüssel maskiert) und an einen Fehlerbericht hängen. Vor dem öffentlichen Teilen bitte durchsehen.',
    diagButton: 'Diagnose herunterladen',
    updTitle: 'Updates', updDesc: 'rcplug und Plugins aktualisieren sich aus signierten Releases auf GitHub. Heruntergeladen wird erst nach „Nach Updates suchen“, installiert erst nach deinem Klick. Einstellungen und Plugin-Daten bleiben erhalten.',
    updOff: 'Updates sind auf diesem Gerät abgeschaltet (RCPLUG_UPDATES=off oder --updates=false).', updCheck: 'Nach Updates suchen', updChecking: 'suche…',
    updNever: 'Noch nicht gesucht.', updChecked: 'Zuletzt gesucht: {at}', updCurrent: 'aktuell', updAvail: 'Update verfügbar',
    updInstall: '{v} installieren', updNotes: 'Versionshinweise', updRelease: 'Release-Seite ↗', updNoTargets: 'Nichts zu prüfen.',
    updConfirmHost: 'rcplug auf {v} aktualisieren?\n\nrcplug und alle Plugins starten neu (etwa eine halbe Minute). Der RØDECaster selbst und sein Audio laufen weiter. Startet die neue Version nicht, kommt automatisch die vorherige zurück.',
    updConfirmPlugin: 'Das Plugin „{name}“ auf {v} aktualisieren?\n\nDas Plugin startet neu; seine Einstellungen und Daten bleiben erhalten.',
    updAuto: 'Täglich nach Updates suchen (fragt nur bei GitHub nach; installiert wird erst nach deinem Klick)', updBadgeNav: '{n} Update(s) verfügbar',
    updPhaseDownload: 'Herunterladen (absichtlich langsam, damit der USB-Ton nicht gestört wird)', updPhaseUnpack: 'Entpacken', updAmount: '{done} von {total} MB · {pct} %', updEta: 'noch etwa {s} s',
    updRunning: '{name} {v} wird installiert…', updRestarting: 'rcplug {v} wird installiert und startet jetzt neu. Die Seite lädt sich von selbst neu, sobald es wieder da ist.',
    updDone: '{name} {v} installiert.', updFailed: 'Das Update ist fehlgeschlagen: {err}', updLog: 'Details',
    updLastOk: 'Letztes rcplug-Update{v}: erfolgreich ({at}).', updLastFail: 'Letztes rcplug-Update{v} fehlgeschlagen ({at}); die vorherige Version blieb bzw. wurde wiederhergestellt.',
    updKeys: 'Vertrauenswürdige Signaturschlüssel: {ids}', updBadge: 'Update {v}', updPlugin: 'Aktualisieren',
    days: '{d} T {h} h', hours: '{h} h {m} min', mins: '{m} min', switchLang: 'English',
    settings: 'Einstellungen', optSave: 'Speichern', optSaveRestart: 'Speichern und neu starten', optSaved: 'Gespeichert.', optSavedRestart: 'Gespeichert; das Plugin startet neu.',
    optDefault: 'Standard: {v}', optReset: 'Standard verwenden', optYes: 'an', optNo: 'aus', optHint: 'Änderungen wirken, wenn das Plugin startet.',
  },
};
let lang = 'en';
try { lang = localStorage.getItem('rcplug-lang') || ((navigator.language || '').toLowerCase().startsWith('de') ? 'de' : 'en'); } catch (e) { /* ignore */ }
if (!T[lang]) lang = 'en';
document.documentElement.lang = lang;
const t = (k, p) => (T[lang][k] ?? T.en[k] ?? k).replace(/\{(\w+)\}/g, (m, n) => (p && n in p ? p[n] : m));

const $ = (s, r = document) => r.querySelector(s);
const dec = (s) => { try { return decodeURIComponent(s); } catch (e) { return s; } };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function jget(u) { const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }
async function jpost(u, body) {
  const init = { method: 'POST', headers: { 'X-Rcplug': '1' } };
  if (body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(body); }
  const r = await fetch(u, init);
  if (!r.ok) {
    const body = (await r.text()).trim();
    let msg = body;
    try { msg = JSON.parse(body).error || body; } catch (e) { /* plain text */ }
    throw new Error(msg || 'HTTP ' + r.status);
  }
  return r.json();
}

let plugins = [], invalid = [], sys = null, route = '', loaded = false, pageSig = '';
let upd = null, updSig = '', updChecking = false, bootVersion = null;
const openLogs = {};
const openOpts = {}; // plugin → the values being edited (kept across re-renders)

function fmtUptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? t('days', { d, h }) : h ? t('hours', { h, m }) : t('mins', { m });
}

async function refresh() {
  try {
    sys = await jget('api/system');
    $('#dot').classList.remove('off');
    const v = [];
    if (sys.cpuTempC !== undefined) v.push(`${t('cpu')} <b>${esc(sys.cpuTempC.toFixed(0))} °C</b>`);
    if (sys.load) v.push(`${t('load')} <b>${esc(sys.load[0])}</b>`);
    if (sys.memTotalKB) v.push(`${t('ramFree')} <b>${esc(Math.round(sys.memAvailableKB / 1024))} MB</b>`);
    if (sys.systemUptimeSec !== undefined) v.push(`${t('up')} <b>${esc(fmtUptime(sys.systemUptimeSec))}</b>`);
    v.push(`rcplug <b>${esc(sys.version)}</b>`);
    // After an update the new rcplug may serve a new dashboard.
    if (bootVersion === null) bootVersion = sys.version;
    else if (sys.version !== bootVersion) { location.reload(); return; }
    $('#vitals').innerHTML = v.join(' · ');
    $('#title').textContent = 'rcplug · ' + (sys.host || 'RØDECaster');
    document.body.classList.remove('offline');
  } catch (e) {
    $('#dot').classList.add('off');
    $('#vitals').textContent = t('offline');
    document.body.classList.add('offline'); // the plugins' states are unknown now
  }
  try { const d = await jget('api/plugins'); plugins = d.plugins || []; invalid = d.invalid || []; loaded = true; } catch (e) { /* keep last */ }
  await loadUpdates(); // local; also for the update badge in the navigation
  renderNav();
  if (!route) go();
  else if (route === 'plugins') { renderPlugins(); updateProgress(); }
  else if (route === 'system') renderSystem();
  else if (route.startsWith('p/')) checkFrame();
}

const uiPlugins = () => plugins.filter((p) => p.hasUI);
// Localised manifest texts (plugin.json "translations"), English otherwise.
const tr = (p, k) => (p.translations && p.translations[lang] && p.translations[lang][k]) || p[k] || '';
function defaultRoute() {
  const ui = uiPlugins();
  const primary = ui.find((p) => p.primary && p.enabled) || ui.find((p) => p.enabled);
  return primary ? 'p/' + primary.name : 'plugins';
}

// A plugin route is p/<name>, optionally followed by a path or query inside
// the plugin's UI (p/sonar?strip=physical1), e.g. from a console action.
function frameRoute() {
  const rest = route.slice(2);
  const i = rest.search(/[/?]/);
  const name = dec(i < 0 ? rest : rest.slice(0, i));
  let sub = i < 0 ? '' : rest.slice(i).replace(/^\//, '');
  // Stay inside the plugin: no "." or ".." segment, also not percent-encoded
  // (browsers resolve %2e%2e like ..), and no backslashes.
  const path = sub.split(/[?#]/)[0];
  if (path.split('/').some((seg) => { const d = dec(seg); return d === '.' || d === '..' || d.includes('/') || d.includes('\\'); })) sub = '';
  return { name, sub };
}
const currentPlugin = () => (route.startsWith('p/') ? frameRoute().name : null);

function renderNav() {
  const cur = currentPlugin();
  const items = uiPlugins().map((p) => `<a href="#/p/${encodeURIComponent(p.name)}" class="${cur === p.name ? 'on' : ''}"${cur === p.name ? ' aria-current="page"' : ''}><span class="st ${esc(p.state)}" aria-hidden="true"></span>${esc(p.icon || '')} ${esc(tr(p, 'title'))}</a>`);
  items.push('<span class="sep"></span>');
  items.push(`<a href="#/plugins" class="${route === 'plugins' ? 'on' : ''}">${esc(t('plugins'))}</a>`);
  const n = upd && upd.available;
  const badge = n ? ` <span class="badge" title="${esc(t('updBadgeNav', { n }))}">${esc(n)}</span>` : '';
  items.push(`<a href="#/system" class="${route === 'system' ? 'on' : ''}">${esc(t('system'))}${badge}</a>`);
  $('#nav').innerHTML = items.join('');
}

function go() {
  route = location.hash.replace(/^#\/?/, '');
  if (!route) {
    if (!loaded) return; // refresh() calls go() again once the plugin list arrived
    route = defaultRoute();
    history.replaceState(null, '', '#/' + route);
  }
  renderNav();
  pageSig = '';
  if (route.startsWith('p/')) { const f = frameRoute(); renderFrame(f.name, f.sub); }
  else if (route === 'system') renderSystem();
  else renderPlugins();
  if ((route === 'system' || route === 'plugins') && !upd) loadUpdates().then(() => (route === 'system' ? renderUpdates() : renderPlugins()));
}
window.addEventListener('hashchange', go);

// ---- embedded plugin UI
let frameFor = null;
function renderFrame(name, sub = '') {
  const p = plugins.find((x) => x.name === name);
  const view = $('#view');
  if (!p) { view.innerHTML = `<div class="empty">${esc(t('notFound'))}</div>`; frameFor = null; return; }
  if (!p.running) {
    frameFor = null;
    view.innerHTML = `<div class="page"><div class="card"><h2>${esc(tr(p, 'title'))}</h2><p class="desc">${esc(tr(p, 'description'))}</p>
      <p>${esc(t('isState', { state: t('st_' + p.state) }))}${p.lastErr ? ' (' + esc(p.lastErr) + ')' : ''}.</p>
      ${p.enabled ? `<p class="muted">${esc(t('autoRestart'))}</p>` : `<button class="primary" id="startIt">${esc(t('start'))}</button>`}<p class="error" id="err"></p></div></div>`;
    const b = $('#startIt');
    if (b) b.onclick = () => act(p.name, 'enable', b);
    return;
  }
  if (frameFor === name + '|' + sub && $('#view iframe')) return;
  frameFor = name + '|' + sub;
  view.innerHTML = `<iframe src="plugins/${encodeURIComponent(name)}/${esc(sub)}" title="${esc(tr(p, 'title'))}" allow="fullscreen"></iframe>`;
}
let stoppedSig = '';
function checkFrame() {
  const { name, sub } = frameRoute();
  const p = plugins.find((x) => x.name === name);
  if (!p || (frameFor === name + '|' + sub) !== !!p.running) { stoppedSig = ''; renderFrame(name, sub); return; }
  // The page shown instead of a stopped plugin follows its state.
  if (!p.running) {
    const sig = JSON.stringify([p.state, p.enabled, p.lastErr, lang]);
    if (sig !== stoppedSig) { stoppedSig = sig; renderFrame(name, sub); }
  }
}

async function act(name, action, btn) {
  if (btn) btn.disabled = true;
  try { await jpost(`api/plugins/${encodeURIComponent(name)}/${action}`); }
  catch (e) { const el = $('#err') || $(`.card[data-name="${CSS.escape(name)}"] .error`); if (el) el.textContent = t('failed', { err: e.message }); }
  setTimeout(() => { if (btn) btn.disabled = false; refresh(); }, 400);
}

// ---- plugin management (rebuilt only when something changed, so focus,
// open logs and scroll positions survive the periodic refresh)
function renderPlugins() {
  frameFor = null;
  const sig = JSON.stringify([plugins, invalid, lang, upd && upd.targets, upd && upd.job && upd.job.state]);
  if (sig === pageSig && $('#view .page')) { refreshLogs(); return; }
  pageSig = sig;
  let html = '<div class="page">';
  if (invalid.length) html += `<div class="banner"><b>${esc(t('skipped'))}</b><br>${invalid.map(esc).join('<br>')}</div>`;
  html += `<div class="row" style="margin-bottom:14px"><h2 style="margin:0;font-size:18px">${esc(t('plugins'))}</h2><span class="spacer"></span><button id="rescan" title="${esc(t('rescanHint'))}">${esc(t('rescan'))}</button></div><div class="grid">`;
  if (!plugins.length) html += `<div class="empty">${esc(t('none'))}<br>${esc(t('noneHint'))}</div>`;
  for (const p of plugins) {
    const st = p.state || 'stopped';
    const u = pluginUpdate(p.name);
    html += `<div class="card" data-name="${esc(p.name)}">
      <div class="row"><h2>${esc(p.icon || '')} ${esc(tr(p, 'title'))}</h2><span class="tag">v${esc(p.version || '?')}</span>${u ? `<span class="tag update">${esc(t('updBadge', { v: u.latest }))}</span>` : ''}${p.needsAudio ? `<span class="tag">${esc(t('audio'))}</span>` : ''}${p.primary ? `<span class="tag">${esc(t('startpage'))}</span>` : ''}
        <span class="spacer"></span><span class="tag ${esc(st)}">${esc(t('st_' + st))}${p.pid ? ' · PID ' + esc(p.pid) : ''}</span></div>
      <p class="desc">${esc(tr(p, 'description'))}</p>
      ${p.unknownFields ? `<p class="error">${esc(t('unknown', { f: p.unknownFields.join(', ') }))}</p>` : ''}
      <div class="row">
        ${p.hasUI ? `<a class="btn" href="#/p/${encodeURIComponent(p.name)}">${esc(t('open'))}</a><a class="btn" href="plugins/${encodeURIComponent(p.name)}/" target="_blank" rel="noopener">${esc(t('newTab'))}</a>` : ''}
        ${p.enabled ? `<button class="danger" data-act="disable">${esc(t('stop'))}</button><button data-act="restart">${esc(t('restart'))}</button>` : `<button class="primary" data-act="enable">${esc(t('start'))}</button>`}
        ${u ? `<button data-act="update"${jobActive() ? ' disabled' : ''}>${esc(t('updPlugin'))}</button>` : ''}
        ${p.options && p.options.length ? `<button class="linkbtn" data-act="settings" aria-expanded="${!!openOpts[p.name]}">${esc(t('settings'))}</button>` : ''}
        <button class="linkbtn" data-act="logs" aria-expanded="${!!openLogs[p.name]}">${esc(t('log'))}</button>
        ${p.restarts ? `<span class="muted" style="font-size:12px">${esc(t('restarts', { n: p.restarts }))}</span>` : ''}
        ${p.lastErr && st !== 'running' ? `<span style="font-size:12px;color:var(--warn)">${esc(p.lastErr)}</span>` : ''}
      </div>${u || (upd && upd.job && upd.job.target === 'plugin:' + p.name) ? `<div data-progress="plugin:${esc(p.name)}"></div>` : ''}<p class="error"></p><div class="opts" ${openOpts[p.name] ? '' : 'hidden'}></div><pre class="logs" ${openLogs[p.name] ? '' : 'hidden'}></pre></div>`;
  }
  html += `</div><p class="note" style="text-align:center">${esc(t('footer'))}</p></div>`;
  $('#view').innerHTML = html;
  $('#rescan').onclick = async (e) => {
    e.target.disabled = true;
    try { await jpost('api/reload'); } catch (x) { alert(t('failed', { err: x.message })); }
    e.target.disabled = false;
    refresh();
  };
  document.querySelectorAll('#view .card[data-name]').forEach((c) => {
    const name = c.dataset.name, logsEl = $('.logs', c);
    const p = plugins.find((x) => x.name === name);
    if (openOpts[name]) renderOptions(p, $('.opts', c));
    c.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => {
      if (b.dataset.act === 'settings') { toggleOptions(p, $('.opts', c), b); return; }
      if (b.dataset.act === 'logs') {
        openLogs[name] = !openLogs[name];
        logsEl.hidden = !openLogs[name];
        b.setAttribute('aria-expanded', String(!!openLogs[name]));
        if (openLogs[name]) loadLogs(name, logsEl);
        return;
      }
      if (b.dataset.act === 'update') { installUpdate('plugin:' + name, b); return; }
      act(name, b.dataset.act, b);
    }));
  });
  refreshLogs();
}
// ---- plugin options (manifest "options", stored by the host in
// config/<plugin>.json; see docs/plugin-api.md#options)
const trOpt = (p, o, k) => (p.translations && p.translations[lang] && p.translations[lang].options && p.translations[lang].options[o.id] && p.translations[lang].options[o.id][k]) || o[k] || '';
const trChoice = (p, o, v) => {
  const c = (o.choices || []).find((x) => x.value === v);
  const l = p.translations && p.translations[lang] && p.translations[lang].options && p.translations[lang].options[o.id];
  return (l && l.choices && l.choices[v]) || (c ? c.title : String(v));
};
async function toggleOptions(p, el, btn) {
  if (openOpts[p.name]) { delete openOpts[p.name]; el.hidden = true; btn.setAttribute('aria-expanded', 'false'); return; }
  try {
    const d = await jget(`api/plugins/${encodeURIComponent(p.name)}/options`);
    openOpts[p.name] = { values: { ...(d.values || {}) } };
  } catch (e) { el.hidden = false; el.textContent = t('failed', { err: e.message }); return; }
  btn.setAttribute('aria-expanded', 'true');
  renderOptions(p, el);
}
function renderOptions(p, el) {
  const st = openOpts[p.name];
  el.hidden = false;
  el.replaceChildren();
  const show = (o, v) => (o.type === 'bool' ? t(v ? 'optYes' : 'optNo') : o.type === 'choice' ? trChoice(p, o, v) : String(v));
  for (const o of p.options) {
    const set = Object.prototype.hasOwnProperty.call(st.values, o.id) && st.values[o.id] !== null;
    const cur = set ? st.values[o.id] : o.default;
    const label = document.createElement('label');
    const title = document.createElement('span');
    title.textContent = trOpt(p, o, 'title');
    let input;
    if (o.type === 'bool') {
      input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = !!cur;
      input.onchange = () => { st.values[o.id] = input.checked; };
      const row = document.createElement('span');
      row.className = 'check';
      row.append(input, title);
      label.append(row);
    } else {
      if (o.type === 'choice') {
        input = document.createElement('select');
        for (const c of o.choices) { const op = new Option(trChoice(p, o, c.value), c.value); input.append(op); }
        input.value = cur ?? '';
      } else {
        input = document.createElement('input');
        input.type = o.type === 'number' ? 'number' : 'text';
        if (o.type === 'number') { input.step = 'any'; if (o.min != null) input.min = o.min; if (o.max != null) input.max = o.max; }
        if (o.maxLength) input.maxLength = o.maxLength;
        input.value = cur ?? '';
      }
      input.onchange = () => { st.values[o.id] = o.type === 'number' ? Number(input.value) : input.value; };
      label.append(title, input);
    }
    const desc = document.createElement('span');
    desc.className = 'odesc';
    desc.textContent = [trOpt(p, o, 'description'), o.default !== undefined ? t('optDefault', { v: show(o, o.default) }) : ''].filter(Boolean).join(' · ');
    label.append(desc);
    if (set) {
      const reset = document.createElement('button');
      reset.type = 'button';
      reset.className = 'linkbtn';
      reset.textContent = t('optReset');
      reset.onclick = (e) => { e.preventDefault(); st.values[o.id] = null; renderOptions(p, el); };
      label.append(reset);
    }
    el.append(label);
  }
  const msg = document.createElement('span');
  msg.className = 'muted';
  msg.style.fontSize = '12px';
  msg.textContent = st.msg || t('optHint');
  const save = document.createElement('button');
  save.type = 'button';
  save.className = 'primary';
  save.textContent = t(p.enabled ? 'optSaveRestart' : 'optSave');
  save.onclick = async () => {
    save.disabled = true;
    try {
      const r = await jpost(`api/plugins/${encodeURIComponent(p.name)}/options`, { values: st.values });
      const d = await jget(`api/plugins/${encodeURIComponent(p.name)}/options`);
      st.values = { ...(d.values || {}) };
      st.msg = t(r.restarted ? 'optSavedRestart' : 'optSaved');
      renderOptions(p, el);
      setTimeout(refresh, 600);
    } catch (e) { msg.textContent = t('failed', { err: e.message }); msg.className = 'error'; save.disabled = false; }
  };
  const row = document.createElement('div');
  row.className = 'row';
  row.append(save, msg);
  el.append(row);
}

function refreshLogs() {
  for (const [name, open] of Object.entries(openLogs)) {
    const el = $(`.card[data-name="${CSS.escape(name)}"] .logs`);
    if (open && el) loadLogs(name, el);
  }
}
async function loadLogs(name, el) {
  const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 4;
  try {
    const d = await jget(`api/plugins/${encodeURIComponent(name)}/logs`);
    el.textContent = (d.lines || []).join('\n') || t('emptyLog');
    if (atBottom) el.scrollTop = el.scrollHeight;
  } catch (e) { el.textContent = t('noLog'); }
}

// ---- system page (the system card is redrawn on every refresh, the
// updates card only when its content changed, so open details stay open)
function renderSystem() {
  frameFor = null;
  if (!sys) { $('#view').innerHTML = `<div class="empty">${esc(t('offline'))}</div>`; return; }
  if (!$('#sysCard')) {
    $('#view').innerHTML = `<div class="page"><div class="card" id="sysCard"></div>
      <div class="card" id="updCard" style="margin-top:14px"></div>
      <div class="card" style="margin-top:14px"><h2>${esc(t('diagTitle'))}</h2><p class="desc">${esc(t('diagText'))}</p>
        <a class="btn primary" href="api/diagnostics" download>${esc(t('diagButton'))}</a></div>
      <p class="note">${esc(t('disclaimer'))}</p></div>`;
    updSig = '';
  }
  const mem = sys.memTotalKB ? `${esc(t('memUsed', { used: Math.round((sys.memTotalKB - sys.memAvailableKB) / 1024), total: Math.round(sys.memTotalKB / 1024) }))}<div class="bar"><i style="width:${((1 - sys.memAvailableKB / sys.memTotalKB) * 100).toFixed(0)}%"></i></div>` : '—';
  const disk = sys.diskTotalMB ? `${esc(t('diskFree', { free: sys.diskFreeMB, total: sys.diskTotalMB }))}<div class="bar"><i style="width:${((1 - sys.diskFreeMB / sys.diskTotalMB) * 100).toFixed(0)}%"></i></div>` : '—';
  const row = (k, v) => `<dt>${esc(t(k))}</dt><dd>${v}</dd>`;
  $('#sysCard').innerHTML = `<h2>${esc(t('sysTitle'))}</h2><p class="desc">${esc(t('sysDesc'))}</p><dl class="kv">
    ${row('hostname', esc(sys.host))}${row('arch', esc(sys.arch + '/' + sys.os))}
    ${row('temp', sys.cpuTempC !== undefined ? esc(sys.cpuTempC.toFixed(1)) + ' °C' : '—')}${row('loadAvg', sys.load ? esc(sys.load.join(' / ')) : '—')}
    ${row('memory', mem)}${row('disk', disk)}
    ${row('devUp', sys.systemUptimeSec !== undefined ? esc(fmtUptime(sys.systemUptimeSec)) : '—')}${row('hostUp', esc(fmtUptime(sys.uptimeSec)))}
    ${row('version', esc(sys.version))}${row('clock', esc(new Date(sys.time).toLocaleString(lang)))}
  </dl>`;
  renderUpdates();
}

// ---- updates
async function loadUpdates() { try { upd = await jget('api/updates'); } catch (e) { /* keep the last state */ } }
const jobActive = () => !!(upd && upd.job && (upd.job.state === 'running' || upd.job.state === 'restarting'));
const pluginUpdate = (name) => (upd && upd.targets || []).find((x) => x.target === 'plugin:' + name && x.available);
const fmtTime = (s) => { const d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleString(lang); };
const logBlock = (lines, open) => (lines && lines.length ? `<details${open ? ' open' : ''}><summary>${esc(t('updLog'))}</summary><pre class="logs">${esc(lines.join('\n'))}</pre></details>` : '');

// progressHTML shows how far a running update's download or unpacking is.
function progressHTML(j) {
  if (!j || j.state !== 'running' || (j.phase !== 'download' && j.phase !== 'unpack')) return '';
  const pct = j.total ? Math.min(100, Math.round((j.done / j.total) * 100)) : 0;
  const mb = (n) => ((n || 0) / 1048576).toLocaleString(lang, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const eta = j.eta ? ' · ' + t('updEta', { s: j.eta }) : '';
  return `<div style="margin-top:8px"><div class="row" style="font-size:12px;gap:8px"><span>${esc(t(j.phase === 'download' ? 'updPhaseDownload' : 'updPhaseUnpack'))}</span><span class="spacer"></span>`
    + `<span class="muted">${esc(t('updAmount', { done: mb(j.done), total: mb(j.total), pct }))}${esc(eta)}</span></div>`
    + `<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div></div>`;
}
// updateProgress refreshes the progress on plugin cards, which are rebuilt
// only when something else changes.
function updateProgress() {
  document.querySelectorAll('[data-progress]').forEach((el) => {
    const j = upd && upd.job;
    el.innerHTML = j && j.target === el.dataset.progress ? progressHTML(j) : '';
  });
}

function renderUpdates() {
  const card = $('#updCard');
  if (!card) return;
  const sig = JSON.stringify([upd, updChecking, lang]);
  if (sig === updSig) return;
  updSig = sig;
  let h = `<h2>${esc(t('updTitle'))}</h2><p class="desc">${esc(t('updDesc'))}</p>`;
  if (!upd) { card.innerHTML = h + `<p class="muted">${esc(t('offline'))}</p>`; return; }
  if (!upd.enabled) { card.innerHTML = h + `<p class="muted">${esc(t('updOff'))}</p>`; return; }
  const busy = jobActive();
  h += `<div class="row"><button class="primary" id="updCheck"${updChecking || busy ? ' disabled' : ''}>${esc(updChecking ? t('updChecking') : t('updCheck'))}</button>
    <span class="muted" style="font-size:12px">${esc(upd.checkedAt ? t('updChecked', { at: fmtTime(upd.checkedAt) }) : t('updNever'))}</span></div>`;
  h += `<label class="row" style="margin-top:10px;font-size:13px;gap:8px"><input type="checkbox" id="updAuto"${upd.autoCheck ? ' checked' : ''}> ${esc(t('updAuto'))}</label>`;
  if (upd.error) h += `<p class="error">${esc(upd.error)}</p>`;
  const j = upd.job;
  if (j) {
    const name = j.target === 'rcplug' ? 'rcplug' : j.target.replace(/^plugin:/, '');
    const msg = j.state === 'restarting' || (j.state === 'running' && j.target === 'rcplug' && (!j.phase || j.phase === 'install')) ? t('updRestarting', { v: j.version })
      : j.state === 'running' ? t('updRunning', { name, v: j.version })
      : j.state === 'done' ? t('updDone', { name, v: j.version }) : t('updFailed', { err: j.error || '?' });
    h += `<div class="banner" style="margin:12px 0 0">${esc(msg)}${progressHTML(j)}${logBlock(j.log, j.state === 'error')}</div>`;
  }
  if (upd.last && !(j && j.target === 'rcplug' && j.state !== 'error')) {
    const v = upd.last.from && upd.last.to ? ` (${upd.last.from} → ${upd.last.to})` : '';
    h += `<p class="${upd.last.ok ? 'ok' : 'error'}" style="margin:12px 0 0">${esc(t(upd.last.ok ? 'updLastOk' : 'updLastFail', { v, at: fmtTime(upd.last.at) }))}</p>${logBlock(upd.last.log, false)}`;
  }
  if (upd.checkedAt) {
    h += '<div style="margin-top:12px">';
    if (!(upd.targets || []).length) h += `<p class="muted">${esc(t('updNoTargets'))}</p>`;
    for (const x of upd.targets || []) {
      const state = x.error ? `<span class="error">${esc(x.error)}</span>`
        : x.available ? `<span class="tag update">${esc(t('updAvail'))}</span>` : `<span class="tag">${esc(t('updCurrent'))}</span>`;
      h += `<div class="upd"><div class="row"><b>${esc(x.name)}</b><span class="ver muted">${esc(x.current || '?')}${x.latest && x.latest !== x.current ? ' → ' + esc(x.latest) : ''}</span>${state}
        <span class="spacer"></span>${x.url ? `<a class="linkbtn" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(t('updRelease'))}</a>` : ''}
        ${x.available ? `<button class="primary" data-target="${esc(x.target)}"${busy ? ' disabled' : ''}>${esc(t('updInstall', { v: x.latest }))}</button>` : ''}</div>
        ${x.available && x.notes ? `<details><summary>${esc(t('updNotes'))}</summary><pre class="logs">${esc(x.notes)}</pre></details>` : ''}</div>`;
    }
    h += '</div>';
  }
  if (upd.keyIds && upd.keyIds.length) h += `<p class="note">${esc(t('updKeys', { ids: upd.keyIds.join(', ') }))}</p>`;
  card.innerHTML = h;
  $('#updCheck').onclick = checkUpdates;
  $('#updAuto').onchange = async (e) => {
    try { upd = await jpost('api/updates/auto?on=' + e.target.checked); } catch (x) { alert(t('failed', { err: x.message })); }
    renderUpdates();
  };
  card.querySelectorAll('[data-target]').forEach((b) => (b.onclick = () => installUpdate(b.dataset.target, b)));
}

async function checkUpdates() {
  updChecking = true;
  renderUpdates();
  try { upd = await jpost('api/updates/check'); } catch (e) { if (upd) upd = { ...upd, error: t('failed', { err: e.message }) }; }
  updChecking = false;
  if (route === 'system') renderUpdates(); else renderPlugins();
}

async function installUpdate(target, btn) {
  const x = (upd && upd.targets || []).find((y) => y.target === target);
  if (!x) return;
  const q = target === 'rcplug' ? t('updConfirmHost', { v: x.latest }) : t('updConfirmPlugin', { name: x.name, v: x.latest });
  if (!confirm(q)) return;
  if (btn) btn.disabled = true;
  try { upd = await jpost('api/updates/install?target=' + encodeURIComponent(target)); }
  catch (e) { alert(t('failed', { err: e.message })); }
  await loadUpdates();
  if (route === 'system') renderUpdates(); else renderPlugins();
}

$('#lang').textContent = t('switchLang');
$('#lang').addEventListener('click', () => {
  try { localStorage.setItem('rcplug-lang', lang === 'de' ? 'en' : 'de'); } catch (e) { /* ignore */ }
  location.reload();
});
$('#boot').textContent = t('connecting');
// Every 4 s; every second while an update is being installed, so its
// progress (and rcplug's restart) shows without delay.
(async function loop() { await refresh(); setTimeout(loop, jobActive() ? 1000 : 4000); })();
</script>
</body>
</html>
