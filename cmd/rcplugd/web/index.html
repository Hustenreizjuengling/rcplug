<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rcplug · RØDECaster</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%2319c37d%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%223%22 fill=%22%230d1015%22/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d1015; --panel:#151a21; --panel2:#1c232c; --line:#2a333f;
    --fg:#e7edf3; --muted:#9aa8b6; --accent:#19c37d; --blue:#2f81f7;
    --danger:#f85149; --warn:#e3a008;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:650;white-space:nowrap}
  header .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  header .dot.off{background:var(--danger);box-shadow:none}
  .vitals{display:flex;gap:14px;color:var(--muted);font-size:12px;margin-left:auto;flex-wrap:wrap}
  .vitals b{color:var(--fg);font-weight:600}
  nav{display:flex;gap:2px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav a{padding:9px 12px;color:var(--muted);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
  nav a:hover{color:var(--fg)}
  nav a.on{color:var(--fg);border-bottom-color:var(--accent)}
  nav a .st{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  nav a .st.running{background:var(--accent)}
  nav a .st.backoff{background:var(--warn)}
  body.offline nav a .st, body.offline .tag.running, body.offline .tag.starting, body.offline .tag.backoff{background:var(--muted);color:var(--muted);border-color:var(--line);opacity:.5}
  nav .sep{flex:1}
  #view{flex:1;min-height:0;display:flex;flex-direction:column}
  iframe{flex:1;border:0;width:100%;background:var(--bg)}
  .page{max-width:960px;margin:0 auto;padding:20px;width:100%;overflow:auto}
  .grid{display:grid;gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .card h2{margin:0 0 2px;font-size:16px}
  .card .desc{color:var(--muted);font-size:13px;margin:0 0 12px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tag{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
  .tag.running{color:var(--accent);border-color:var(--accent)}
  .tag.starting{color:var(--blue);border-color:var(--blue)}
  .tag.backoff{color:var(--warn);border-color:var(--warn)}
  .spacer{flex:1}
  button,.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:7px 14px;text-decoration:none}
  button:hover,.btn:hover{border-color:var(--blue)}
  button:disabled{opacity:.5;cursor:default}
  button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:#04261a;font-weight:600}
  button.danger{color:var(--danger);border-color:var(--danger);background:transparent}
  button.small{padding:3px 10px;font-size:12px}
  .logs{margin-top:12px;background:#0a0d12;border:1px solid var(--line);border-radius:8px;padding:10px;
    font:12px ui-monospace,Menlo,Consolas,monospace;color:#c9d4df;max-height:240px;overflow:auto;white-space:pre-wrap}
  .muted{color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:50px 20px}
  .linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;padding:0;font-size:12px}
  .banner{background:#2a2110;border:1px solid var(--warn);color:#ffe2a3;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
  .error{color:#ffb3ae;font-size:12px}
  dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0}
  dl.kv dt{color:var(--muted)} dl.kv dd{margin:0}
  .bar{height:6px;background:#0a0d12;border-radius:3px;overflow:hidden;border:1px solid var(--line);margin-top:4px}
  .bar i{display:block;height:100%;background:var(--accent)}
  .note{color:var(--muted);font-size:12px;margin-top:16px}
  .tag.update{color:var(--blue);border-color:var(--blue)}
  .perms{margin:0 0 10px;font-size:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .tag.perm{cursor:help}
  #catSources input{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
  #catSources summary{cursor:pointer;font-weight:600}
  .tag.perm.strong{color:var(--warn);border-color:var(--warn)}
  .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--blue);color:#fff;font-size:11px;font-weight:600;text-align:center;line-height:18px}
  .upd{border-top:1px solid var(--line);padding:10px 0}
  .upd:first-child{border-top:0}
  .upd .ver{font-variant-numeric:tabular-nums}
  details summary{cursor:pointer;color:var(--muted);font-size:12px}
  details .logs{margin-top:6px}
  .ok{color:var(--accent)}
  .opts{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:12px}
  .opts label{display:grid;gap:3px;font-size:13px}
  .opts .odesc{color:var(--muted);font-size:12px}
  .opts select,.opts input[type=text],.opts input[type=number]{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:320px}
  .opts .check{display:flex;gap:8px;align-items:center}
  .opts .linkbtn{justify-self:start}
  .opts[hidden]{display:none}
  table.procs{width:100%;border-collapse:collapse;font-size:13px}
  table.procs th{color:var(--muted);font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
  table.procs td{padding:4px 6px;border-bottom:1px solid var(--line)}
  table.procs .num{text-align:right;font-variant-numeric:tabular-nums}
  .evlist{max-height:320px;overflow:auto;font-size:12px}
  .card.danger{border-color:var(--danger)}
  .ev{padding:4px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
  .ev:first-child{border-top:0}
  .ev code{font:11px ui-monospace,Menlo,Consolas,monospace;color:var(--muted)}
  @media (max-width:700px){ .vitals{margin-left:0;width:100%} }
</style>
</head>

let procSort = 'cpu';
function bindProcSort() {

async function loadProcs() {

  const owner = (p) => p.owner === 'rcplug' ? `<span class="tag update">${esc(p.plugin === 'rcplugd' ? 'rcplug' : p.plugin)}</span>` : p.owner === 'rode' ? '<span class="tag">RØDE</span>' : '';
  const kt = d.kernelThreads || { count: 0, cpu: 0 };
  const cpuLine = d.cpu ? `<p style="margin:0 0 8px"><b>${esc(t('procCPUNow', { total: pc(d.cpu.total) }))}</b> <span class="muted" style="font-size:12px">${esc(t('procCPUParts', { user: pc(d.cpu.user), system: pc(d.cpu.system), irq: pc(d.cpu.irq), io: pc(d.cpu.iowait), cores }))}</span></p>` : '';
  el.innerHTML = cpuLine + `<table class="procs"><thead><tr><th>${esc(t('procName'))}</th><th>PID</th><th class="num">CPU</th><th class="num" title="${esc(t('procOwnHint'))}">${esc(t('procOwn'))}</th><th class="num" title="${esc(t('procSharedHint'))}">${esc(t('procShared'))}</th><th class="num">${esc(t('procThreads'))}</th></tr></thead><tbody>`

    + (kt.count ? `<tr class="muted"><td>${esc(t('procKernel', { n: kt.count }))}</td><td></td><td class="num">${esc(pc(kt.cpu / cores))} %</td><td class="num">–</td><td class="num">–</td><td></td></tr>` : '')
    + `</tbody></table><p class="note">${esc(t('procFoot', { n: d.count, own: mb(d.ownKB || 0), programs: mb((d.memory && d.memory.programsKB) || 0) }))}</p>`;

// ---- the event bus, live on the System page
let evSource = null;
const evKept = [];
function startEvents() {
  stopEvents();
  evKept.length = 0;
  renderEvents();
  try {
    evSource = new EventSource('api/events/stream?since=0');
    evSource.addEventListener('rcplug', (m) => {
      try { evKept.unshift(JSON.parse(m.data)); } catch (e) { return; }
      evKept.splice(30);
      renderEvents();
    });
  } catch (e) { /* no event bus (older host) */ }
}
function stopEvents() { if (evSource) { evSource.close(); evSource = null; } }
function renderEvents() {
  const el = $('#evList');
  if (!el) return;
  if (!evKept.length) { el.innerHTML = `<p class="muted">${esc(t('evNone'))}</p>`; return; }
  el.innerHTML = evKept.map((e) => `<div class="ev"><span class="muted">${esc(new Date(e.time).toLocaleTimeString(lang))}</span> <b>${esc(e.type)}</b> <span class="tag">${esc(e.source)}</span> <code>${esc(e.data ? JSON.stringify(e.data) : '')}</code></div>`).join('');
}

const fmtSize = (n) => (n >= 1048576 ? (n / 1048576).toLocaleString(lang, { maximumFractionDigits: 1 }) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');

// ---- updates
async function loadUpdates() { try { upd = await jget('api/updates'); } catch (e) { /* keep the last state */ } }
const jobActive = () => !!(upd && upd.job && (upd.job.state === 'running' || upd.job.state === 'restarting'));
const pluginUpdate = (name) => (upd && upd.targets || []).find((x) => x.target === 'plugin:' + name && x.available);
const fmtTime = (s) => { const d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleString(lang); };
const logBlock = (lines, open) => (lines && lines.length ? `<details${open ? ' open' : ''}><summary>${esc(t('updLog'))}</summary><pre class="logs">${esc(lines.join('\n'))}</pre></details>` : '');

// progressHTML shows how far a running update's download or unpacking is.
function progressHTML(j) {
  if (!j || j.state !== 'running' || (j.phase !== 'download' && j.phase !== 'unpack')) return '';
  const pct = j.total ? Math.min(100, Math.round((j.done / j.total) * 100)) : 0;
  const mb = (n) => ((n || 0) / 1048576).toLocaleString(lang, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const eta = j.eta ? ' · ' + t('updEta', { s: j.eta }) : '';
  return `<div style="margin-top:8px"><div class="row" style="font-size:12px;gap:8px"><span>${esc(t(j.phase === 'download' ? 'updPhaseDownload' : 'updPhaseUnpack'))}</span><span class="spacer"></span>`
    + `<span class="muted">${esc(t('updAmount', { done: mb(j.done), total: mb(j.total), pct }))}${esc(eta)}</span></div>`
    + `<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div></div>`;
}
// updateProgress refreshes the progress on plugin cards, which are rebuilt
// only when something else changes.
function updateProgress() {
  document.querySelectorAll('[data-progress]').forEach((el) => {
    const j = upd && upd.job;
    el.innerHTML = j && j.target === el.dataset.progress ? progressHTML(j) : '';
  });
}

function renderUpdates() {
  const card = $('#updCard');

  const sig = JSON.stringify([upd, updChecking, lang]);

  if (!upd.enabled) { card.innerHTML = h + `<p class="muted">${esc(t('updOff'))}</p>`; return; }
  const busy = jobActive();
  h += `<div class="row"><button class="primary" id="updCheck"${updChecking || busy ? ' disabled' : ''}>${esc(updChecking ? t('updChecking') : t('updCheck'))}</button>
    <span class="muted" style="font-size:12px">${esc(upd.checkedAt ? t('updChecked', { at: fmtTime(upd.checkedAt) }) : t('updNever'))}</span></div>`;
  h += `<label class="row" style="margin-top:10px;font-size:13px;gap:8px"><input type="checkbox" id="updAuto"${upd.autoCheck ? ' checked' : ''}> ${esc(t('updAuto'))}</label>`;
  if (upd.error) h += `<p class="error">${esc(upd.error)}</p>`;
  const j = upd.job;
  if (j) {
    const name = j.target === 'rcplug' ? 'rcplug' : j.target.replace(/^(plugin|install):/, '');
    const msg = j.state === 'restarting' || (j.state === 'running' && j.target === 'rcplug' && (!j.phase || j.phase === 'install')) ? t('updRestarting', { v: j.version })
      : j.state === 'running' ? t('updRunning', { name, v: j.version })
      : j.state === 'done' ? t('updDone', { name, v: j.version }) : t('updFailed', { err: j.error || '?' });
    h += `<div class="banner" style="margin:12px 0 0">${esc(msg)}${progressHTML(j)}${logBlock(j.log, j.state === 'error')}</div>`;
  }
  if (upd.last && !(j && j.target === 'rcplug' && j.state !== 'error')) {
    const v = upd.last.from && upd.last.to ? ` (${upd.last.from} → ${upd.last.to})` : '';
    h += `<p class="${upd.last.ok ? 'ok' : 'error'}" style="margin:12px 0 0">${esc(t(upd.last.ok ? 'updLastOk' : 'updLastFail', { v, at: fmtTime(upd.last.at) }))}</p>${logBlock(upd.last.log, false)}`;
  }
  if (upd.checkedAt) {
    h += '<div style="margin-top:12px">';
    if (!(upd.targets || []).length) h += `<p class="muted">${esc(t('updNoTargets'))}</p>`;
    for (const x of upd.targets || []) {
      const state = x.error ? `<span class="error">${esc(x.error)}</span>`
        : x.available ? `<span class="tag update">${esc(t('updAvail'))}</span>` : `<span class="tag">${esc(t('updCurrent'))}</span>`;
      h += `<div class="upd"><div class="row"><b>${esc(x.name)}</b><span class="ver muted">${esc(x.current || '?')}${x.latest && x.latest !== x.current ? ' → ' + esc(x.latest) : ''}</span>${state}
        <span class="spacer"></span>${x.url ? `<a class="linkbtn" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(t('updRelease'))}</a>` : ''}
        ${x.available ? `<button class="primary" data-target="${esc(x.target)}"${busy ? ' disabled' : ''}>${esc(t('updInstall', { v: x.latest }))}</button>` : ''}</div>
        ${x.available && x.notes ? `<details><summary>${esc(t('updNotes'))}</summary><pre class="logs">${esc(x.notes)}</pre></details>` : ''}</div>`;
    }
    h += '</div>';
  }
  if (upd.keyIds && upd.keyIds.length) h += `<p class="note">${esc(t('updKeys', { ids: upd.keyIds.join(', ') }))}</p>`;
  card.innerHTML = h;
  $('#updCheck').onclick = checkUpdates;
  $('#updAuto').onchange = async (e) => {
    try { upd = await jpost('api/updates/auto?on=' + e.target.checked); } catch (x) { alert(t('failed', { err: x.message })); }
    renderUpdates();
  };
  card.querySelectorAll('[data-target]').forEach((b) => (b.onclick = () => installUpdate(b.dataset.target, b)));
}

async function checkUpdates() {
  updChecking = true;
  renderUpdates();
  try { upd = await jpost('api/updates/check'); } catch (e) { if (upd) upd = { ...upd, error: t('failed', { err: e.message }) }; }
  updChecking = false;
  if (route === 'system') renderUpdates(); else renderPlugins();
}

async function installUpdate(target, btn) {
  const x = (upd && upd.targets || []).find((y) => y.target === target);
  if (!x) return;
  const q = target === 'rcplug' ? t('updConfirmHost', { v: x.latest }) : t('updConfirmPlugin', { name: x.name, v: x.latest });
  if (!confirm(q)) return;
  if (btn) btn.disabled = true;
  try { upd = await jpost('api/updates/install?target=' + encodeURIComponent(target)); }
  catch (e) { alert(t('failed', { err: e.message })); }
  await loadUpdates();
  if (route === 'system') renderUpdates(); else renderPlugins();
}

$('#lang').textContent = t('switchLang');
$('#lang').addEventListener('click', () => {
  try { localStorage.setItem('rcplug-lang', lang === 'de' ? 'en' : 'de'); } catch (e) { /* ignore */ }
  location.reload();
});
$('#boot').textContent = t('connecting');
// Every 4 s; every second while an update is being installed, so its
// progress (and rcplug's restart) shows without delay.
(async function loop() { await refresh(); setTimeout(loop, jobActive() ? 1000 : 4000); })();
</script>
</body>
</html>
