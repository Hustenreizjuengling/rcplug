<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rcplug · log in</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2334d399%22 stroke-width=%222%22 stroke-linecap=%22round%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%229.5%22/%3E%3Cpath d=%22M8 15.5v-4M12 15.5V8.5M16 15.5v-6%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/ui/rcplug.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(1200px 600px at 50% -10%, rgba(52, 211, 153, .08), transparent 60%), var(--bg); }
  main { width: 100%; max-width: 380px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; justify-content: center; }
  .brand .i { width: 34px; height: 34px; color: var(--accent); stroke-width: 2; }
  .brand b { font-size: 20px; letter-spacing: -.01em; }
  form.card { padding: 26px 24px 22px; box-shadow: var(--shadow); }
  form h1 { font-size: 18px; margin-bottom: 4px; }
  .input { width: 100%; height: 42px; margin: 18px 0 6px; font-size: 15px; }
  .btn.primary { width: 100%; height: 42px; margin-top: 6px; }
  .error { min-height: 1.3em; margin: 4px 0; }
  .link { margin-top: 16px; display: block; }
  .box { margin-top: 14px; }
</style>
</head>
<body>
<main>
  <div class="brand"><svg class="i" aria-hidden="true"><use href="/ui/icons.svg#logo"/></svg><b>rcplug</b></div>
  <form class="card" id="form">
    <h1 id="title"></h1>
    <p class="muted small" id="hint"></p>
    <input class="input" type="password" id="pw" autocomplete="current-password" required autofocus>
    <p class="error" id="err" role="alert"></p>
    <button class="btn primary" type="submit" id="go"></button>
    <button class="link" type="button" id="forgot"></button>
    <div class="banner info box" id="reset" hidden></div>
  </form>
</main>
<script>
'use strict';
const T = {
  en: { title: 'Log in', hint: 'This RØDECaster\'s dashboard is protected by a password.', placeholder: 'Password', go: 'Log in',
    wrong: 'Wrong password.', locked: 'Too many wrong passwords; try again in a minute.', failed: 'Could not log in: {err}',
    forgot: 'Forgot the password?', resetConfirm: 'Remove the password at the device? You then have one minute: press the Listen button of channel 1 on the device four times in quick succession (it is back as before afterwards).',
    resetWait: 'Now press the Listen button of channel 1 on the device four times in quick succession – {s} s left.',
    resetDone: 'Password removed at the device. The dashboard is open again; set a new password on its System page.', resetFailed: 'Not removed: {err}' },
  de: { title: 'Anmelden', hint: 'Das Dashboard dieses RØDECasters ist mit einem Passwort geschützt.', placeholder: 'Passwort', go: 'Anmelden',
    wrong: 'Falsches Passwort.', locked: 'Zu viele falsche Passwörter; bitte in einer Minute erneut versuchen.', failed: 'Anmelden nicht möglich: {err}',
    forgot: 'Passwort vergessen?', resetConfirm: 'Passwort am Gerät entfernen? Danach hast du eine Minute: Drücke am Gerät viermal schnell hintereinander die Listen-Taste von Kanal 1 (danach ist sie wieder wie vorher).',
    resetWait: 'Jetzt am Gerät viermal schnell die Listen-Taste von Kanal 1 drücken – noch {s} s.',
    resetDone: 'Passwort am Gerät entfernt. Das Dashboard ist wieder offen; ein neues Passwort setzt du auf seiner Seite System.', resetFailed: 'Nicht entfernt: {err}' },
};
let lang = 'en';
try { lang = localStorage.getItem('rcplug-lang') || ((navigator.language || '').toLowerCase().startsWith('de') ? 'de' : 'en'); } catch (e) { /* ignore */ }
if (!T[lang]) lang = 'en';
document.documentElement.lang = lang;
const t = (k, p) => (T[lang][k] || T.en[k] || k).replace(/\{(\w+)\}/g, (m, n) => (p && n in p ? p[n] : m));
const $ = (id) => document.getElementById(id);
$('title').textContent = t('title');
$('hint').textContent = t('hint');
$('pw').placeholder = t('placeholder');
$('pw').setAttribute('aria-label', t('placeholder'));
$('go').textContent = t('go');
$('forgot').textContent = t('forgot');

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'X-Rcplug': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  let d = {};
  try { d = await r.json(); } catch (e) { /* empty */ }
  return { ok: r.ok, status: r.status, d };
}
$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('go').disabled = true;
  $('err').textContent = '';
  const r = await post('/api/login', { password: $('pw').value }).catch((x) => ({ ok: false, d: { error: x.message } }));
  $('go').disabled = false;
  if (r.ok || r.d.code === 'no_password') { location.replace('/'); return; }
  $('err').textContent = r.d.code === 'wrong_password' ? t('wrong') : r.d.code === 'login_locked' ? t('locked') : t('failed', { err: r.d.error || '?' });
  $('pw').select();
});
$('forgot').addEventListener('click', async () => {
  if (!confirm(t('resetConfirm'))) return;
  const box = $('reset');
  box.hidden = false;
  const r = await post('/api/access/reset');
  if (!r.ok) { box.textContent = t('resetFailed', { err: r.d.error || r.status }); return; }
  const id = setInterval(async () => {
    const s = await fetch('/api/access', { cache: 'no-store' }).then((x) => x.json()).catch(() => null);
    if (!s) return;
    const rs = s.reset || {};
    if (!s.protected) { clearInterval(id); box.textContent = t('resetDone'); setTimeout(() => location.replace('/'), 2500); return; }
    if (rs.active) { box.textContent = t('resetWait', { s: rs.seconds }); return; }
    clearInterval(id);
    box.textContent = t('resetFailed', { err: rs.error || '?' });
  }, 700);
});
</script>
</body>
</html>
