name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Everything is built and tested with the current Go release, as the release
# files are; the "minimum Go" job keeps the SDK usable with the Go version
# go.mod names.
jobs:
  test:
    name: Go tests, lint, web tests, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: gofmt, vet, race tests, web tests, shellcheck, doc links
        run: make check

  minimum-go:
    name: Tests with the minimum Go version (go.mod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...

  arm64:
    name: Tests on arm64 (qemu-user)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install qemu-user
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - run: make test-arm64

  install:
    name: Device installer and in-app updates (sandbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install, reinstall, failure halfway, rollback
        run: make install-test
      - name: Update 0.8.0 → 0.9.0 from a fake GitHub, rollback of a broken 0.9.1
        run: make update-test

  cross:
    name: Device package and other platforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Device package
        run: make package
      - name: Development tools build everywhere
        run: |
          for target in darwin/arm64 darwin/amd64 windows/amd64; do
            echo "== $target"
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build ./...
          done
      - uses: actions/upload-artifact@v7
        with:
          name: rcplug-package
          path: |
            dist/rcplug-*-aarch64.tar.gz
            dist/SHA256SUMS
