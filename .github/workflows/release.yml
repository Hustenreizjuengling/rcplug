name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tag must match VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - run: make test package
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk -v v="$(cat VERSION)" '$0 ~ "^## \\[?"v"\\]?" {p=1; next} /^## / && p {exit} p' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" --title "rcplug $GITHUB_REF_NAME" --notes "$notes" \
            dist/rcplug-*-aarch64.tar.gz dist/rcplug-examples-*-aarch64.tar.gz dist/SHA256SUMS
