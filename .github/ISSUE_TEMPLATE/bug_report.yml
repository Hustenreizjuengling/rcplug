name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please never paste passwords, Wi-Fi keys or the device's serial number.
  - type: input
    id: version
    attributes:
      label: rcplug version
      description: Shown at the top right of the dashboard, or `cat <install dir>/VERSION`.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and firmware
      placeholder: RØDECaster Duo, firmware 1.7.4
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The log from the dashboard's Plugins page, or <install dir>/logs/rcplugd.log.
      render: text
