<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console · RØDECaster</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%2319c37d%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%223%22 fill=%22%230d1015%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true">◉</span>
    <div>
      <div class="dev" id="devName">RØDECaster</div>
      <div class="sub" id="devSub">…</div>
    </div>
  </div>
  <div class="conn" id="conn" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span class="txt">…</span></div>
  <div class="ctl" role="radiogroup">
    <button type="button" role="radio" data-level="off">Read only</button>
    <button type="button" role="radio" data-level="basic">Control</button>
    <button type="button" role="radio" data-level="expert">Expert</button>
  </div>
  <button type="button" class="ghost lang" id="lang">DE</button>
</header>
<nav class="tabs" id="tabs" aria-label="Views"></nav>
<main id="main"><div class="empty">…</div></main>
<div id="toasts"></div>
<dialog id="dlg"><form method="dialog"><div id="dlgBody"></div><menu><button type="button" class="ghost" id="dlgCancel">Cancel</button><button value="ok" class="primary" id="dlgOk">OK</button></menu></form></dialog>
<dialog id="drawer" class="drawer" aria-labelledby="drawerTitle"><div class="drawer-head"><h2 id="drawerTitle"></h2><button type="button" class="ghost" id="drawerClose" aria-label="Close">✕</button></div><div id="drawerBody"></div></dialog>
<noscript>This console needs JavaScript.</noscript>
</body>
</html>
