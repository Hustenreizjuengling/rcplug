<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Console · RØDECaster</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2334d399%22 stroke-width=%222%22 stroke-linecap=%22round%22%3E%3Cpath d=%22M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="ui/rcplug.css">
<link rel="stylesheet" href="app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="i logo" aria-hidden="true"><use href="ui/icons.svg#mixer"/></svg>
    <div class="brand-text">
      <div class="dev" id="devName">RØDECaster</div>
      <div class="sub" id="devSub">…</div>
    </div>
  </div>
  <nav class="tabs views" id="tabs" aria-label="Views"></nav>
  <div class="status">
    <div class="conn pill" id="conn" role="status" aria-live="polite"><span class="txt">…</span></div>
    <div class="seg ctl" role="radiogroup">
      <button type="button" role="radio" data-level="off">Read only</button>
      <button type="button" role="radio" data-level="basic">Control</button>
      <button type="button" role="radio" data-level="expert">Expert</button>
    </div>
    <button type="button" class="btn ghost sm lang" id="lang">DE</button>
  </div>
</header>
<main id="main"><div class="empty">…</div></main>
<div id="toasts"></div>
<dialog id="dlg"><form method="dialog"><div id="dlgBody"></div><menu><button type="button" class="btn ghost" id="dlgCancel">Cancel</button><button value="ok" class="btn primary" id="dlgOk">OK</button></menu></form></dialog>
<dialog id="drawer" class="drawer" aria-labelledby="drawerTitle"><div class="drawer-head"><h2 id="drawerTitle"></h2><button type="button" class="btn ghost icon" id="drawerClose" aria-label="Close"><svg class="i" aria-hidden="true"><use href="ui/icons.svg#close"/></svg></button></div><div id="drawerBody"></div></dialog>
<noscript>This console needs JavaScript.</noscript>
</body>
</html>
