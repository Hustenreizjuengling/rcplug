<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recording log · rcplug</title>
<style>
  :root{--bg:#0d1015;--panel:#151a21;--line:#2a333f;--fg:#e7edf3;--muted:#9aa8b6;--rec:#f85149}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}
  main{max-width:760px;margin:0 auto;padding:20px}
  h1{font-size:18px;margin:0 0 4px} .muted{color:var(--muted)}
  table{width:100%;border-collapse:collapse;margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)} th{color:var(--muted);font-weight:500}
  .rec{color:var(--rec);font-weight:600}
  button{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div class="muted" id="live"></div>
  <table><thead><tr><th id="hShow"></th><th id="hStart"></th><th id="hLen"></th></tr></thead><tbody id="rows"></tbody></table>
  <button type="button" id="clear"></button>
</main>
<script>
'use strict';
// A plugin page is plain HTML served by the plugin itself. All URLs are
// relative, so it works both standalone and behind /plugins/<name>/.
const T = {
  en: { title: 'Recording log', show: 'Show', start: 'Started', len: 'Length', running: '● recording', clear: 'Clear log', confirm: 'Delete all entries?', empty: 'No recordings yet.' },
  de: { title: 'Aufnahme-Log', show: 'Show', start: 'Beginn', len: 'Länge', running: '● nimmt auf', clear: 'Log leeren', confirm: 'Alle Einträge löschen?', empty: 'Noch keine Aufnahmen.' },
};
let lang = 'en';
try { lang = localStorage.getItem('rcplug-lang') || (navigator.language.startsWith('de') ? 'de' : 'en'); } catch (e) { /* ignore */ }
const t = (k) => (T[lang] || T.en)[k];
const $ = (s) => document.querySelector(s);
$('#title').textContent = t('title'); $('#hShow').textContent = t('show');
$('#hStart').textContent = t('start'); $('#hLen').textContent = t('len'); $('#clear').textContent = t('clear');

const dur = (s) => { s = Math.round(s); return `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
function cell(text, cls) { const td = document.createElement('td'); td.textContent = text; if (cls) td.className = cls; return td; }

async function load() {
  try {
    const r = await fetch('api/log', { cache: 'no-store' });
    const d = await r.json();
    $('#live').textContent = d.live;
    const rows = $('#rows'); rows.textContent = '';
    const list = (d.entries || []).slice().reverse();
    if (!list.length) { const tr = document.createElement('tr'); const td = cell(t('empty'), 'muted'); td.colSpan = 3; tr.append(td); rows.append(tr); }
    for (const e of list) {
      const tr = document.createElement('tr');
      const open = !e.end;
      const secs = open ? (Date.now() - Date.parse(e.start)) / 1000 : e.seconds;
      tr.append(cell(e.show || '—'), cell(new Date(e.start).toLocaleString(lang)), cell(open ? `${t('running')} ${dur(secs)}` : dur(secs), open ? 'rec' : ''));
      rows.append(tr);
    }
  } catch (e) { $('#live').textContent = String(e); }
}
$('#clear').addEventListener('click', async () => {
  if (!confirm(t('confirm'))) return;
  await fetch('api/clear', { method: 'POST', headers: { 'X-Rcplug': '1' } }); // the header passes the CSRF check
  load();
});
load();
setInterval(load, 2000);
</script>
</body>
</html>
